version: '1.0'
services:
  # webapp config
  web:
    container_name: erp_app
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - 3000:3000
    networks:
      express_network:
  # postgres config
  db:
    container_name: pg_database
    restart: always
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      express_network:

volumes:
  pgdata:

networks:
  express_network:
